<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Requests</title>
<style>
  :root {
    --accent: #707070;
    --accent-foreground: #ffffff;
    --amber: #b7791f;
    --background: #fbfbfb;
    --body: #1d1d1d;
    --border: #d8d8d8;
    --border-strong: #c4c4c4;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    --foreground: #1d1d1d;
    --green: #1a7f37;
    --inset: none;
    --muted: #707070;
    --red: #cf222e;
    --secondary: #4a4a4a;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    --subpanel: #e9e9e9;
    --surface: #f1f1f1;
    --surface-hover: #e9e9e9;
    --tint: rgba(0, 0, 0, 0.04);
    --tint-strong: rgba(0, 0, 0, 0.08);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #ffffff;
      --accent-foreground: #0b0b0c;
      --amber: #fbbf24;
      --background: #08090a;
      --body: #f7f8f8;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --foreground: #ffffff;
      --green: #34d399;
      --inset: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      --muted: #8a8f98;
      --red: #fb7185;
      --secondary: #acacac;
      --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --subpanel: #0e0f11;
      --surface: #171717;
      --surface-hover: #201f1f;
      --tint: rgba(255, 255, 255, 0.04);
      --tint-strong: rgba(255, 255, 255, 0.08);
    }
  }

  * { box-sizing: border-box; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--tint-strong); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--background); }
  ::selection { background: var(--tint-strong); }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  body { -webkit-font-smoothing: antialiased; background: var(--background); color: var(--body); display: flex; flex-direction: column; font: 13px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; }
  button { align-items: center; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--muted); cursor: pointer; display: inline-flex; font: inherit; gap: 6px; padding: 4px 10px; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
  button:disabled { cursor: default; opacity: 0.6; }
  button:hover { color: var(--foreground); }
  footer { background: var(--background); border-top: 1px solid var(--border); bottom: 0; color: var(--muted); font-size: 11px; padding: 8px 14px; position: sticky; }
  h1 { color: var(--foreground); font-size: 14px; font-weight: 600; letter-spacing: 0.16px; margin: 0; }
  header { -webkit-backdrop-filter: blur(12px); align-items: center; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--background) 90%, transparent); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 14px; position: sticky; top: 0; z-index: 1; }
  main { flex: 1; padding: 4px 0 16px; }
  svg { fill: none; flex: none; height: 14px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; width: 14px; }
  .arrow { color: var(--muted); display: inline-flex; opacity: 0.6; }
  .attention { align-items: center; background: var(--tint); border: 1px solid var(--border-strong); border-radius: 6px; color: var(--foreground); display: inline-flex; font-size: 11px; font-weight: 500; gap: 6px; padding: 1px 8px; }
  .attention::before { background: var(--amber); border-radius: 50%; content: ''; height: 6px; width: 6px; }
  .attention.clear::before { background: var(--green); }
  .chip { align-items: center; background: var(--tint); border: 1px solid var(--border); border-radius: 4px; color: var(--muted); display: inline-flex; font-size: 11px; gap: 5px; padding: 1px 7px; white-space: nowrap; }
  .chip svg { height: 12px; width: 12px; }
  .chip.amber, .chip.green, .chip.red { color: var(--body); }
  .chip.amber::before, .chip.green::before, .chip.red::before { border-radius: 50%; content: ''; height: 6px; width: 6px; }
  .chip.amber::before { background: var(--amber); }
  .chip.green::before { background: var(--green); }
  .chip.mono { background: var(--subpanel); color: var(--secondary); font-family: var(--font-mono); }
  .chip.outline { background: transparent; }
  .chip.red::before { background: var(--red); }
  .chips { align-items: center; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .cost { color: var(--foreground); font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 40px 14px; text-align: center; }
  .error { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); border-radius: 6px; color: var(--red); margin: 10px 14px; padding: 8px 12px; }
  .filters { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .group { align-items: center; border-bottom: 1px solid var(--border); color: var(--foreground); display: flex; font-family: var(--font-mono); font-size: 12px; font-weight: 600; gap: 8px; letter-spacing: 0.06em; margin: 14px 14px 8px; padding: 6px 2px; text-transform: uppercase; }
  .group svg { color: var(--muted); }
  .kind { align-items: center; background: var(--tint); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--muted); display: flex; height: 20px; justify-content: center; margin-top: 1px; width: 20px; }
  .kind svg { height: 13px; width: 13px; }
  .menu { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: var(--shadow); min-width: 200px; padding: 4px; position: fixed; z-index: 2; }
  .menu button { border-radius: 4px; color: var(--body); font-size: 13px; gap: 8px; justify-content: flex-start; padding: 6px 10px; width: 100%; }
  .menu button svg { color: var(--muted); }
  .menu button:hover { background: var(--tint-strong); color: var(--foreground); }
  .menu button:hover svg { color: var(--foreground); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .meta { align-items: center; color: var(--muted); display: flex; gap: 12px; }
  .meta button { font-size: 12px; padding: 2px 4px; }
  .next-move { align-items: center; color: var(--muted); display: inline-flex; font-size: 11px; gap: 5px; }
  .next-move strong { color: var(--secondary); font-weight: 500; }
  .next-move.you { background: var(--accent); border-radius: 4px; color: var(--accent-foreground); font-weight: 600; padding: 1px 8px; }
  .next-move.you strong { background: color-mix(in srgb, var(--accent-foreground) 10%, transparent); border-radius: 3px; color: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; padding: 0 4px; text-transform: uppercase; }
  .number { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: 8px; }
  .pull-request { align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--inset); display: grid; gap: 0 10px; grid-template-columns: auto minmax(0, 1fr) auto; margin: 0 14px 6px; padding: 10px 12px; transition: background-color 0.15s, border-color 0.15s; }
  .pull-request:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .pull-request > div { min-width: 0; }
  .pull-request.muted { opacity: 0.5; }
  .refresh { background: var(--tint); border-color: var(--border-strong); color: var(--foreground); font-size: 12px; font-weight: 500; padding: 4px 12px; }
  .refresh svg { color: var(--muted); }
  .refresh:hover { background: var(--tint-strong); }
  .segments { background: var(--subpanel); border: 1px solid var(--border); border-radius: 6px; display: flex; gap: 2px; padding: 2px; }
  .segments button { border-radius: 4px; font-size: 12px; font-weight: 500; padding: 3px 10px; }
  .segments button.selected { background: var(--surface); border-color: var(--border); box-shadow: var(--inset); color: var(--foreground); font-weight: 600; }
  .segments button:hover { background: var(--tint); }
  .sessions { background: var(--subpanel); border: 1px solid var(--border); border-radius: 6px; color: var(--secondary); font-size: 12px; grid-column: 2 / -1; list-style: none; margin: 8px 0 0; padding: 6px 0; }
  .sessions .cost { color: var(--muted); font-size: 12px; }
  .sessions li { display: flex; gap: 12px; justify-content: space-between; padding: 4px 12px 4px 28px; position: relative; }
  .sessions li::after { background: var(--border-strong); content: ''; height: 1px; left: 14px; position: absolute; top: 50%; width: 8px; }
  .sessions li::before { background: var(--border-strong); bottom: 0; content: ''; left: 14px; position: absolute; top: 0; width: 1px; }
  .sessions li:first-child::before { top: 50%; }
  .sessions li:hover { background: var(--tint); }
  .sessions li:last-child::before { bottom: 50%; }
  .sessions li:only-child::before { display: none; }
  .summary { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
  .title { color: var(--foreground); font-weight: 500; }
  .toast { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; bottom: 44px; box-shadow: var(--shadow); color: var(--body); font-size: 12px; left: 14px; padding: 8px 12px; position: fixed; right: 14px; z-index: 2; }
  .toast.error { color: var(--red); }

  @media (max-width: 560px) {
    .filters { margin-left: 0; }
    .meta { grid-column: 2 / -1; margin-top: 6px; }
    .pull-request { grid-template-columns: auto minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Pull requests</h1>
  <span id="attention" class="attention" hidden></span>
  <span id="summary" class="summary"></span>
  <nav id="filters" class="filters"></nav>
</header>
<main id="list"></main>
<footer id="footer"></footer>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
  const ACTION_DONE_MESSAGES = { 'copy-link': 'Link copied.', discuss: 'Workspace created.', fix: 'Workspace created.' };
  const ACTION_MESSAGES = { discuss: 'Creating a Discuss workspace…', fix: 'Creating a Fix workspace…' };
  const ICONS = {
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    bell: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
    bellOff: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    comment: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    externalLink: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    orca: '<circle cx="12" cy="12" r="9"/><path d="m10 9 5 3-5 3V9z" fill="currentColor"/>',
    pullRequest: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    repository: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    sessions: '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
    stacked: '<circle cx="6" cy="6" r="3"/><path d="M6 9v12"/><path d="M13 6h3a2 2 0 0 1 2 2v3"/><path d="M18 15v6"/><path d="M21 18h-6"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
  };
  const FILTER_KEY = 'filter';
  const Filter = { All: 'all', Muted: 'muted', MyMove: 'my-move', Waiting: 'waiting' };
  const MenuAction = { CopyLink: 'copy-link', Discuss: 'discuss', Fix: 'fix', Mute: 'mute', OpenInBrowser: 'open-in-browser', OpenInOrca: 'open-in-orca' };
  const ORCA_PLUGIN = window.orca?.plugin ?? null;
  const OWNERS = { checks: ['', ICONS.clock, 'Checks'], reviewers: ['', ICONS.eye, 'Reviewers'], you: ['you', null, 'You'] };
  const POLL_MILLISECONDS = 30000;
  const TOAST_MILLISECONDS = 4000;
  const TOKEN = new URLSearchParams(location.search).get('token') ?? '';
  const expandedSessions = new Set();
  let filter = readFilter();
  let menuPullRequest = null;
  let state = null;
  let toastTimer = null;

  /**
   * Hide the right click menu.
   */

  function closeMenu() {
    document.getElementById('menu').hidden = true;
    menuPullRequest = null;
  }

  /**
   * Escape a value for HTML.
   */

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => `&#${character.charCodeAt(0)};`);
  }

  /**
   * Format a cost in dollars.
   */

  function formatCost(cost) {
    return cost > 0 ? `$${cost.toFixed(2)}` : '—';
  }

  /**
   * Format a timestamp as minutes, hours or days ago.
   */

  function formatRelative(timestamp) {
    if (!timestamp) {
      return '';
    }

    const minutes = Math.max(0, Math.round((Date.now() - new Date(timestamp).getTime()) / 60000));

    if (minutes < 60) {
      return `${minutes}m ago`;
    }

    if (minutes < 60 * 24) {
      return `${Math.round(minutes / 60)}h ago`;
    }

    return `${Math.round(minutes / (60 * 24))}d ago`;
  }

  /**
   * Render an icon.
   */

  function icon(paths) {
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths}</svg>`;
  }

  /**
   * Check whether a pull request passes the selected filter.
   */

  function matchesFilter(pullRequest) {
    if (filter === Filter.Muted) {
      return pullRequest.isMuted;
    }

    if (pullRequest.isMuted) {
      return false;
    }

    if (filter === Filter.MyMove) {
      return pullRequest.needsAttention;
    }

    if (filter === Filter.Waiting) {
      return !pullRequest.needsAttention;
    }

    return true;
  }

  /**
   * Read the saved filter.
   */

  function readFilter() {
    try {
      return Object.values(Filter).includes(localStorage.getItem(FILTER_KEY)) ? localStorage.getItem(FILTER_KEY) : Filter.All;
    } catch {
      return Filter.All;
    }
  }

  /**
   * Show the right click menu for a pull request at the pointer.
   */

  function openMenu(pullRequest, x, y) {
    const menu = document.getElementById('menu');

    menuPullRequest = pullRequest;
    menu.innerHTML = renderMenu(pullRequest);
    menu.hidden = false;
    menu.style.left = `${Math.min(x, innerWidth - menu.offsetWidth - 8)}px`;
    menu.style.top = `${Math.min(y, innerHeight - menu.offsetHeight - 8)}px`;
  }

  /**
   * Render a chip.
   */

  function renderChip(kind, label, paths) {
    return `<span class="chip ${kind}">${paths ? icon(paths) : ''}${escapeHtml(label)}</span>`;
  }

  /**
   * Render the status chips, the owner of the next move and its reason.
   */

  function renderChips(pullRequest) {
    const checks = { failing: ['red', 'Checks failing'], passing: ['green', 'Checks passing'], pending: ['', 'Checks running', ICONS.clock] }[pullRequest.checks];
    const [ownerKind, ownerIcon, ownerLabel] = OWNERS[pullRequest.nextMove.owner] ?? ['', null, pullRequest.nextMove.owner];
    const review = { APPROVED: ['green', 'Approved'], CHANGES_REQUESTED: ['red', 'Changes requested'], REVIEW_REQUIRED: ['outline', 'Review required'] }[pullRequest.reviewDecision];
    const chips = [];

    if (pullRequest.isDraft) {
      chips.push(renderChip('outline', 'Draft'));
    }

    if (checks) {
      chips.push(renderChip(...checks));
    }

    if (review) {
      chips.push(renderChip(...review));
    }

    if (pullRequest.hasConflicts) {
      chips.push(renderChip('red', 'Conflicts'));
    }

    if (pullRequest.threadsAwaitingReply > 0) {
      chips.push(renderChip('mono', pullRequest.threadsAwaitingReply, ICONS.comment));
    }

    chips.push(`<span class="arrow">${icon(ICONS.arrow)}</span>`);
    chips.push(`<span class="next-move ${ownerKind}">${ownerIcon ? icon(ownerIcon) : ''}<strong>${escapeHtml(ownerLabel)}</strong>${escapeHtml(pullRequest.nextMove.reason)}</span>`);

    return `<div class="chips">${chips.join('')}</div>`;
  }

  /**
   * Render the filter buttons and the refresh button.
   */

  function renderFilters() {
    const mutedCount = state?.dashboard?.pullRequests.filter(pullRequest => pullRequest.isMuted).length ?? 0;
    const options = [[Filter.All, 'All'], [Filter.MyMove, 'My move'], [Filter.Waiting, 'Waiting'], [Filter.Muted, `${icon(ICONS.bellOff)}Muted (${mutedCount})`]];

    document.getElementById('filters').innerHTML = `<span class="segments">${options
      .map(([value, label]) => `<button type="button" data-filter="${value}" class="${value === filter ? 'selected' : ''}">${label}</button>`)
      .join('')}</span><button type="button" class="refresh" data-action="refresh" ${state?.refreshing ? 'disabled' : ''}>${icon(ICONS.refresh)}${state?.refreshing ? 'Refreshing…' : 'Refresh'}</button>`;
  }

  /**
   * Render the right click menu items for a pull request.
   */

  function renderMenu(pullRequest) {
    const items = [
      [MenuAction.OpenInBrowser, ICONS.externalLink, 'Open in browser'],
      [MenuAction.OpenInOrca, ICONS.orca, 'Open in Orca'],
      null,
      [MenuAction.Discuss, ICONS.comment, 'Discuss'],
      [MenuAction.Fix, ICONS.wrench, 'Fix'],
      null,
      [MenuAction.CopyLink, ICONS.copy, 'Copy PR link'],
      pullRequest.isMuted ? [MenuAction.Mute, ICONS.bell, 'Unmute notifications'] : [MenuAction.Mute, ICONS.bellOff, 'Mute notifications']
    ];

    return items.map(item => (item ? `<button type="button" data-menu="${item[0]}">${icon(item[1])}${item[2]}</button>` : '<hr>')).join('');
  }

  /**
   * Render one pull request row.
   */

  function renderPullRequest(pullRequest, depth) {
    const sessions = expandedSessions.has(pullRequest.url)
      ? `<ul class="sessions">${pullRequest.worktrees.length ? `<li>Worktrees: ${pullRequest.worktrees.map(worktree => escapeHtml(worktree.name)).join(', ')}</li>` : ''}${
          pullRequest.sessions.map(session => `<li><span>${escapeHtml(session.agentName)} · ${escapeHtml(session.title)} · ${escapeHtml(formatRelative(session.lastActivityAt))}</span><span class="cost">${formatCost(session.cost)}</span></li>`).join('') ||
          '<li>No linked agent sessions.</li>'
        }</ul>`
      : '';
    const shortRepository = pullRequest.repository.split('/').pop();

    return `<article class="pull-request ${pullRequest.isMuted ? 'muted' : ''}" style="margin-left: ${14 + depth * 30}px">
      <span class="kind">${icon(depth > 0 ? ICONS.stacked : ICONS.pullRequest)}</span>
      <div>
        <a class="title" href="${escapeHtml(pullRequest.url)}" target="_blank" rel="noreferrer" data-url="${escapeHtml(pullRequest.url)}">${escapeHtml(pullRequest.title)}</a><span class="number">${escapeHtml(shortRepository)}#${pullRequest.number}</span>
        ${renderChips(pullRequest)}
      </div>
      <div class="meta">
        <span class="cost" title="Estimated from linked agent transcripts">${formatCost(pullRequest.cost)}</span>
        <button type="button" data-action="sessions" data-url="${escapeHtml(pullRequest.url)}" title="Linked sessions">${icon(ICONS.sessions)}${pullRequest.sessions.length}</button>
        <button type="button" data-action="mute" data-url="${escapeHtml(pullRequest.url)}" data-muted="${pullRequest.isMuted}" title="${pullRequest.isMuted ? 'Unmute' : 'Mute'}">${icon(pullRequest.isMuted ? ICONS.bellOff : ICONS.bell)}</button>
      </div>
      ${sessions}
    </article>`;
  }

  /**
   * Render a pull request and the ones stacked on it.
   */

  function renderTree(pullRequest, childrenByParent, depth) {
    const children = childrenByParent.get(pullRequest.url) ?? [];

    return `${renderPullRequest(pullRequest, depth)}${children.map(child => renderTree(child, childrenByParent, depth + 1)).join('')}`;
  }

  /**
   * Render the whole page.
   */

  function render() {
    const attention = document.getElementById('attention');
    const dashboard = state?.dashboard;
    const list = document.getElementById('list');

    renderFilters();
    document.getElementById('footer').textContent = dashboard ? `Updated ${formatRelative(dashboard.refreshedAt)} · refreshes every 3 minutes` : '';

    if (!dashboard) {
      attention.hidden = true;
      list.innerHTML = state?.error ? `<div class="error">${escapeHtml(state.error)}</div>` : '<div class="empty">Loading pull requests…</div>';

      return;
    }

    const visible = dashboard.pullRequests.filter(matchesFilter);
    const byUrl = new Map(visible.map(pullRequest => [pullRequest.url, pullRequest]));
    const childrenByParent = new Map();
    const groups = new Map();
    const totalCost = dashboard.pullRequests.reduce((total, pullRequest) => total + pullRequest.cost, 0);

    for (const pullRequest of [...visible].sort((first, second) => second.updatedAt.localeCompare(first.updatedAt))) {
      if (pullRequest.parentUrl && byUrl.has(pullRequest.parentUrl)) {
        childrenByParent.set(pullRequest.parentUrl, [...(childrenByParent.get(pullRequest.parentUrl) ?? []), pullRequest]);
      } else {
        groups.set(pullRequest.repository, [...(groups.get(pullRequest.repository) ?? []), pullRequest]);
      }
    }

    attention.hidden = false;
    attention.textContent = dashboard.attentionCount > 0 ? `${dashboard.attentionCount} need${dashboard.attentionCount === 1 ? 's' : ''} attention` : 'Nothing needs you';
    attention.classList.toggle('clear', dashboard.attentionCount === 0);
    document.getElementById('summary').textContent = totalCost > 0 ? `${formatCost(totalCost)} across linked sessions` : '';
    list.innerHTML = `${state.error ? `<div class="error">Last refresh failed: ${escapeHtml(state.error)}</div>` : ''}${
      [...groups].map(([repository, roots]) => `<div class="group">${icon(ICONS.repository)}${escapeHtml(repository)}</div>${roots.map(root => renderTree(root, childrenByParent, 0)).join('')}`).join('') ||
      '<div class="empty">No pull requests here.</div>'
    }`;
  }

  /**
   * Call the worker: through the panel bridge in the sidebar, or the local server in a browser tab.
   */

  async function request(name, input) {
    if (ORCA_PLUGIN) {
      return ORCA_PLUGIN.request(name, input);
    }

    const routes = { 'dashboard.refresh': ['POST', '/api/refresh'], 'dashboard.state': ['GET', '/api/state'], 'pull-request.action': ['POST', '/api/action'], 'pull-request.mute': ['POST', '/api/mute'] };
    const [method, path] = routes[name];
    const response = await fetch(path, {
      body: input ? JSON.stringify(input) : undefined,
      headers: { 'content-type': 'application/json', 'x-dashboard-token': TOKEN },
      method
    });

    if (!response.ok) {
      throw new Error((await response.json()).error ?? response.statusText);
    }

    return response.json();
  }

  /**
   * Run a pull request action and tell the user how it went.
   */

  async function runAction(action, url) {
    if (ACTION_MESSAGES[action]) {
      showToast(ACTION_MESSAGES[action]);
    }

    try {
      await request('pull-request.action', { action, url });

      if (ACTION_DONE_MESSAGES[action]) {
        showToast(ACTION_DONE_MESSAGES[action]);
      }
    } catch (error) {
      showToast(error.message, true);
    }
  }

  /**
   * Run a right click menu item for a pull request.
   */

  function runMenuAction(action, pullRequest) {
    if (action === MenuAction.Mute) {
      load('pull-request.mute', { muted: !pullRequest.isMuted, url: pullRequest.url });

      return;
    }

    runAction(action, pullRequest.url);
  }

  /**
   * Run a worker call and render its state.
   */

  async function load(name = 'dashboard.state', input) {
    try {
      state = await request(name, input);
    } catch (error) {
      state = { ...state, error: error.message };
    }

    render();
  }

  /**
   * Show a short message above the footer.
   */

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');

    clearTimeout(toastTimer);
    toast.classList.toggle('error', isError);
    toast.hidden = false;
    toast.textContent = message;
    toastTimer = setTimeout(() => (toast.hidden = true), TOAST_MILLISECONDS);
  }

  /**
   * Save the selected filter.
   */

  function writeFilter(value) {
    try {
      localStorage.setItem(FILTER_KEY, value);
    } catch {}
  }

  document.body.addEventListener('click', event => {
    const button = event.target.closest('button');
    const link = event.target.closest('a[data-url]');

    if (button?.dataset.menu) {
      const pullRequest = menuPullRequest;

      closeMenu();
      runMenuAction(button.dataset.menu, pullRequest);

      return;
    }

    closeMenu();

    if (link) {
      event.preventDefault();
      runAction(MenuAction.OpenInBrowser, link.dataset.url);

      return;
    }

    if (!button) {
      return;
    }

    if (button.dataset.filter) {
      filter = button.dataset.filter;
      writeFilter(filter);
      render();

      return;
    }

    if (button.dataset.action === 'refresh') {
      state = { ...state, refreshing: true };
      render();
      load('dashboard.refresh');

      return;
    }

    if (button.dataset.action === 'sessions') {
      expandedSessions.has(button.dataset.url) ? expandedSessions.delete(button.dataset.url) : expandedSessions.add(button.dataset.url);
      render();

      return;
    }

    if (button.dataset.action === 'mute') {
      load('pull-request.mute', { muted: button.dataset.muted !== 'true', url: button.dataset.url });
    }
  });

  document.body.addEventListener('contextmenu', event => {
    const row = event.target.closest('.pull-request');
    const url = row?.querySelector('a[data-url]').dataset.url;
    const pullRequest = state?.dashboard?.pullRequests.find(candidate => candidate.url === url);

    if (!pullRequest) {
      closeMenu();

      return;
    }

    event.preventDefault();
    openMenu(pullRequest, event.clientX, event.clientY);
  });
  document.addEventListener('keydown', event => event.key === 'Escape' && closeMenu());
  window.addEventListener('blur', closeMenu);

  if (ORCA_PLUGIN) {
    ORCA_PLUGIN.on('dashboard.changed', nextState => {
      state = nextState;
      render();
    });
  }

  setInterval(ORCA_PLUGIN ? render : load, POLL_MILLISECONDS);
  load();
</script>
</body>
</html>
